plugins {
    id 'com.android.application'
}

def googleWebClientId = project.findProperty('MULTIPRO_GOOGLE_WEB_CLIENT_ID')
        ?: System.getenv('MULTIPRO_GOOGLE_WEB_CLIENT_ID')
        ?: '915863016319-g522r49r3bfhpe3q71v4fbte24argtre.apps.googleusercontent.com'

android {
    // Keep normal debug testing as default; select local explicitly for isolated tests.
    testBuildType project.findProperty('multiproTestBuildType') ?: 'debug'
    namespace 'com.multipro.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.multipro.mobile'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '1.3.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'API_BASE_URL', '"https://multipro-production.up.railway.app/api/v1/"'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + googleWebClientId + '"'
    }

    buildTypes {
        local {
            initWith debug
            applicationIdSuffix '.local'
            versionNameSuffix '-local'
            matchingFallbacks = ['debug']
            buildConfigField 'String', 'API_BASE_URL', '"http://127.0.0.1:8080/api/v1/"'
            buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '""'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'androidx.credentials:credentials:1.6.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
